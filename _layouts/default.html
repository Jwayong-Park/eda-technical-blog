<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta name="theme-color" content="#071523">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jwayong EDA Lab home">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span class="brand-copy"><strong>JWAYONG</strong><em>EDA LAB</em></span>
    </a>
    <span class="brand-tagline">Semiconductor · EDA · Timing · AI</span>
    <nav aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/categories.html' | relative_url }}">Categories⌄</a>
      <a href="{{ '/tags.html' | relative_url }}">Tags</a>
      <a href="{{ '/search.html' | relative_url }}">⌕&nbsp; Search</a>
    </nav>
  </div>
</header>

{{ content }}

<footer>
  <div class="container footer-inner">
    <strong>Jwayong EDA Lab</strong>
    <span>Semiconductor Design · EDA · Timing · Logic Implementation · AI Engineering</span>
  </div>
</footer>
</body>
</html>
