<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}">Jwayong EDA Lab</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/categories.html' | relative_url }}">Categories</a>
      <a href="{{ '/tags.html' | relative_url }}">Tags</a>
      <a href="{{ '/search.html' | relative_url }}">Search</a>
    </nav>
  </div>
</header>

{{ content }}

<footer>
  <div class="container">Jwayong EDA Lab · Semiconductor Design & AI Engineering</div>
</footer>
</body>
</html>
